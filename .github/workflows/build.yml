name: Build and test VST3
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libfreetype-dev libfontconfig1-dev libxrender-dev libgl1-mesa-dev xvfb ngspice python3-venv
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Verify component catalogue
        run: python tools/generate_catalog.py --check
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Compare circuit solver with ngspice
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 -m venv build/validation-venv
          build/validation-venv/bin/pip install numpy==2.2.6
          build/validation-venv/bin/python tools/validate_spice.py --probe build/circuit_probe --ngspice /usr/bin/ngspice --output build/spice-validation
      - name: Validate Linux VST3 including GUI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fL https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip -o pluginval.zip
          unzip pluginval.zip -d validator
          chmod +x validator/pluginval
          xvfb-run -a validator/pluginval --strictness-level 5 --timeout-ms 120000 --validate "$PWD/build/JerzyMuff_artefacts/Release/VST3/Jerzy Muff Collection.vst3"
      - name: Validate Windows VST3 including GUI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath validator
          & ./validator/pluginval.exe --strictness-level 5 --timeout-ms 120000 --validate "$pwd/build/JerzyMuff_artefacts/Release/VST3/Jerzy Muff Collection.vst3"
          exit $LASTEXITCODE
      - name: Package Windows
        if: runner.os == 'Windows'
        run: python scripts/package.py "build/JerzyMuff_artefacts/Release/VST3/Jerzy Muff Collection.vst3" Win64 --juce-source build/_deps/juce-src
      - name: Package Linux
        if: runner.os == 'Linux'
        run: python3 scripts/package.py "build/JerzyMuff_artefacts/Release/VST3/Jerzy Muff Collection.vst3" Linux --juce-source build/_deps/juce-src
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: JerzyMuffCollection-${{ runner.os }}-VST3
          path: dist/*
          if-no-files-found: error
